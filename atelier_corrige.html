<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier – gestion de projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--ink:#1a2238;--bg:#eef1f7;--sf:#fff;--ln:#d9dfeb;--tx:#1a2238;--mu:#667291;--ac:#2f6df6;--ok:#1f9d63;--wa:#d98a00;--ko:#d6403a}
@media(prefers-color-scheme:dark){:root{--ink:#0d1220;--bg:#151b2b;--sf:#1d2540;--ln:#2d3757;--tx:#e9edf8;--mu:#aab5d4}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}a{color:var(--ac)}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}input,textarea{width:100%}button{cursor:pointer}button:disabled,select:disabled{opacity:.6;cursor:not-allowed}button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}button.del{color:var(--ko);padding:6px 9px}
small,.mu{color:var(--mu)}.box{max-width:420px;margin:8vh auto;padding:0 16px;display:grid;gap:10px}
.lay{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}aside{background:var(--ink);color:#e9edf8;padding:18px 14px;display:flex;flex-direction:column;gap:8px;min-height:100vh}
aside input,aside button:not(.pri){background:#ffffff14;border-color:#ffffff29;color:#fff}aside small{color:#9aa6c8}.pj{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;overflow-wrap:anywhere}.pj:hover,.pj.on{background:#ffffff1f}
main{padding:24px;max-width:1100px;width:100%;min-width:0}.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--ln);margin:14px 0}.tabs button{border:0;background:none;border-radius:8px 8px 0 0;padding:8px 14px}.tabs .on{font-weight:600;box-shadow:inset 0 -3px var(--ac)}
.bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--ln);margin-bottom:6px}.bar i{display:block}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.form{display:grid;gap:8px;padding:14px;border:1px dashed var(--ln);border-radius:10px;margin:14px 0}.it{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--ln)}
.chat{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px;margin-top:14px}.sl{padding:7px 10px;border-radius:8px;cursor:pointer;overflow-wrap:anywhere}.sl.on{background:var(--sf);font-weight:600;box-shadow:inset 3px 0 var(--ac)}.msgs{height:340px;overflow:auto;display:grid;gap:8px;align-content:start;margin-bottom:10px}.m{background:var(--sf);border:1px solid var(--ln);padding:7px 11px;border-radius:12px 12px 12px 3px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}.m.me{justify-self:end;background:var(--ac);border-color:var(--ac);color:#fff;border-radius:12px 12px 3px 12px}.m.me small{color:#dbe6ff}
.tw{overflow-x:auto;margin-top:14px}table{width:100%;border-collapse:collapse}th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}.termine{color:var(--ok)}.en_cours{color:var(--ac)}.en_pause{color:var(--wa)}.bloque{color:var(--ko)}.notice{padding:10px 12px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:760px){.lay,.chat{grid-template-columns:1fr}aside{min-height:auto}main{padding:16px}.row{flex-wrap:wrap}.row>*{max-width:100%}}
</style>
</head>
<body><div id="app"><div class="box">Chargement…</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';
// URL et clé publique Supabase. Une clé publishable/anon peut être exposée dans le navigateur,
// mais les tables doivent impérativement être protégées par des politiques RLS.
const SUPABASE_URL = 'https://wvxhjpmvxqjkriunconn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1Vegdzrwfivk6GT1iamWTQ_qXoojXGV';

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link = t => esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`);
const ST = {non_commence:'Non commencé',en_cours:'En cours',en_pause:'En pause',bloque:'Bloqué',termine:'Terminé'};
const COL = {non_commence:'var(--ln)',en_cours:'var(--ac)',en_pause:'var(--wa)',bloque:'var(--ko)',termine:'var(--ok)'};
const PM = ['Aucun accès','Lecture','Lecture et écriture'];
const SEC = [['mission','Missions','p_missions'],['document','Documents','p_docs'],['info','Infos','p_infos'],['chat','Salons','p_chat']];
let db, S = {pid:null,tab:null,salon:null,ch:null,mem:[],projets:[]};

function showError(error, prefix='Erreur') {
  console.error(prefix, error);
  alert(`${prefix} : ${error?.message || error || 'erreur inconnue'}\n\nVérifie les tables et les règles RLS de Supabase.`);
}
async function runQuery(query, label) {
  const result = await query;
  if (result.error) { showError(result.error, label); return null; }
  return result.data;
}
async function init() {
  if (!window.supabase) { app.innerHTML='<div class="box"><h1>Atelier</h1><p>Impossible de charger Supabase. Vérifie ta connexion Internet.</p></div>'; return; }
  if (!SUPABASE_URL.startsWith('https://') || !SUPABASE_KEY) {
    app.innerHTML='<div class="box"><h1>Configuration Supabase</h1><p>Renseigne SUPABASE_URL et SUPABASE_KEY dans le code.</p></div>'; return;
  }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const {data,error} = await db.auth.getSession();
  if (error) return showError(error,'Lecture de session impossible');
  if (data.session) await start(data.session.user); else authView();
  db.auth.onAuthStateChange((_event, session) => {
    // Le démarrage initial est géré ci-dessus; les événements SIGNED_OUT sont traités ici.
    if (!session && S.user) { cleanupChannel(); S={pid:null,tab:null,salon:null,ch:null,mem:[],projets:[]}; authView(); }
  });
}
function authView(mode='in') {
  cleanupChannel();
  const up = mode === 'up';
  app.innerHTML = `<div class="box"><h1>Atelier</h1><p class="mu">Gère tes projets en équipe : missions, documents et discussions.</p>
  <div class="tabs"><button class="${up?'':'on'}" onclick="authView('in')">Connexion</button><button class="${up?'on':''}" onclick="authView('up')">Créer un compte</button></div>
  ${up?'<input id="ps" placeholder="Pseudo (lettres, chiffres, _)" maxlength="20" autocomplete="username">':''}
  <input id="em" type="email" placeholder="Email" autocomplete="email">
  <input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="${up?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')auth('${mode}')">
  <button class="pri" onclick="auth('${mode}')">${up?'Créer mon compte':'Se connecter'}</button><small id="msg"></small></div>`;
}
async function auth(mode) {
  const email=$('#em')?.value.trim(), password=$('#pw')?.value, m=$('#msg');
  if (!email || !password) { m.textContent='Renseigne ton email et ton mot de passe.'; return; }
  if (password.length < 6) { m.textContent='Le mot de passe doit contenir au moins 6 caractères.'; return; }
  if (mode==='up') {
    const pseudo=$('#ps')?.value.trim().toLowerCase();
    if (!/^[a-z0-9_]{3,20}$/.test(pseudo||'')) { m.textContent='Pseudo invalide : 3 à 20 caractères, lettres, chiffres ou _. '; return; }
    const {data,error}=await db.auth.signUp({email,password,options:{data:{pseudo}}});
    if (error) { m.textContent=error.message; return; }
    if (data.session && data.user) await start(data.user);
    else m.textContent='Compte créé. Confirme ton email si Supabase le demande, puis connecte-toi.';
    return;
  }
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if (error) { m.textContent=error.message; return; }
  await start(data.user);
}
async function logout() {
  cleanupChannel();
  const {error}=await db.auth.signOut();
  if(error) return showError(error,'Déconnexion impossible');
  S={pid:null,tab:null,salon:null,ch:null,mem:[],projets:[]};
  authView();
}
function cleanupChannel() { if (S.ch && db) { db.removeChannel(S.ch); S.ch=null; } }

async function start(user) {
  S.user=user;
  const profile = await runQuery(db.from('profiles').select('pseudo').eq('id',user.id).maybeSingle(),'Chargement du profil');
  if (!profile) {
    app.innerHTML=`<div class="box"><h1>Profil manquant</h1><p>Le compte est connecté, mais aucun profil n'existe pour cet utilisateur. Vérifie le trigger SQL de création des profils dans Supabase.</p><button onclick="logout()">Déconnexion</button></div>`;
    return;
  }
  S.pseudo=profile.pseudo || user.user_metadata?.pseudo || user.email || 'Utilisateur';
  await loadProjets();
  draw();
}
async function loadProjets() {
  const data=await runQuery(db.from('projets').select('*,chef:profiles!chef_id(pseudo)').order('created_at',{ascending:true}),'Chargement des projets');
  if(data) S.projets=data;
}
async function loadMem() {
  const data=await runQuery(db.from('membres').select('*,profil:profiles!user_id(pseudo)').eq('projet_id',S.pid),'Chargement des membres');
  if(data) S.mem=data;
}
const P=()=>S.projets.find(p=>p.id===S.pid);
const chef=()=>!!P() && P().chef_id===S.user?.id;
const perm=k=>{
  if(chef()) return 2;
  const sec=SEC.find(s=>s[0]===k);
  if(!sec) return 0;
  const m=S.mem.find(x=>x.user_id===S.user?.id);
  return m ? Number(m[sec[2]]||0) : 0;
};
function draw() {
  app.innerHTML=`<div class="lay"><aside><h1>Atelier</h1>
  ${S.projets.map(p=>`<div class="pj ${p.id===S.pid?'on':''}" onclick="openP('${p.id}')"><span>${esc(p.nom)}</span><small>${p.chef_id===S.user.id?'chef':''}</small></div>`).join('')||'<small>Aucun projet pour l’instant.</small>'}
  <input id="np" maxlength="100" placeholder="Nom du nouveau projet" onkeydown="if(event.key==='Enter')newP()"><button class="pri" onclick="newP()">Créer le projet</button>
  <div class="row" style="margin-top:auto;justify-content:space-between"><span>${esc(S.pseudo)}</span><button onclick="logout()">Déconnexion</button></div></aside>
  <main id="main"><p class="mu">Choisis un projet, ou crée le tien : tu en seras le chef.</p></main></div>`;
  if(S.pid && P()) drawP();
}
async function newP() {
  const input=$('#np'), nom=input?.value.trim();
  if(!nom) return;
  const data=await runQuery(db.from('projets').insert({nom,chef_id:S.user.id}).select('id').single(),'Création du projet');
  if(!data) return;
  await loadProjets(); await openP(data.id);
}
async function openP(id) {
  if(!S.projets.some(p=>p.id===id)) return;
  cleanupChannel(); S.pid=id; S.tab=null; S.salon=null;
  await loadMem(); draw();
}
async function delP() {
  if(!chef()) return alert('Seul le chef du projet peut le supprimer.');
  if(!confirm('Supprimer définitivement ce projet et ses données associées ?')) return;
  const result=await db.from('projets').delete().eq('id',S.pid);
  if(result.error) return showError(result.error,'Suppression du projet');
  S.pid=null; S.tab=null; S.salon=null; await loadProjets(); draw();
}
async function drawP() {
  cleanupChannel();
  const p=P(); if(!p) return;
  const tabs=[...SEC.filter(s=>perm(s[0])>0).map(s=>[s[0],s[1]]),['membres','Membres']];
  if(!tabs.some(t=>t[0]===S.tab)) S.tab=tabs[0]?.[0]||'membres';
  $('#main').innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>${esc(p.nom)}</h2><small>Chef de projet : ${esc(p.chef?.pseudo||'inconnu')}</small></div>${chef()?'<button class="del" onclick="delP()">Supprimer le projet</button>':''}</div>
  <div id="prog" style="margin:14px 0"></div><div class="tabs">${tabs.map(t=>`<button class="${t[0]===S.tab?'on':''}" onclick="S.tab='${t[0]}';drawP()">${t[1]}</button>`).join('')}</div><div id="tab"></div>`;
  const fn={mission:items,document:items,info:items,chat:salons,membres};
  if(fn[S.tab]) await fn[S.tab]();
  if(perm('mission')>0) await progress();
}
async function progress() {
  const data=await runQuery(db.from('items').select('statut').eq('projet_id',S.pid).eq('type','mission'),'Calcul de progression');
  const g=$('#prog'); if(!g||!data) return;
  const c={}; Object.keys(ST).forEach(s=>c[s]=data.filter(i=>i.statut===s).length);
  const n=data.length, pc=n?Math.round(c.termine/n*100):0;
  g.innerHTML=`<div class="bar">${Object.keys(ST).filter(s=>c[s]).map(s=>`<i title="${ST[s]}" style="flex:${c[s]};background:${COL[s]}"></i>`).join('')}</div><small>${n?`${pc} % terminé (${c.termine} mission${c.termine>1?'s':''} sur ${n})`:'Aucune mission pour l’instant.'}</small>`;
}
async function items() {
  const k=S.tab,w=perm(k)>1, ph={mission:'Description de la mission',document:'Lien (https://…) ou contenu du document',info:'Information à partager'}[k];
  const data=await runQuery(db.from('items').select('*,auteur:profiles!auteur_id(pseudo),ass:profiles!assigne_a(pseudo)').eq('projet_id',S.pid).eq('type',k).order('created_at',{ascending:false}),'Chargement des éléments');
  if(!data) return;
  const ppl=[[P().chef_id,P().chef?.pseudo||'Chef'],...S.mem.map(m=>[m.user_id,m.profil?.pseudo||'Membre'])];
  const rows=data.map(i=>`<div class="it"><div class="row"><b style="flex:1">${esc(i.titre)}</b>${k==='mission'?`<select class="${esc(i.statut)}" ${w?'':'disabled'} onchange="setSt('${i.id}',this.value)">${Object.entries(ST).map(([v,l])=>`<option value="${v}" ${i.statut===v?'selected':''}>${l}</option>`).join('')}</select>`:''}${w?`<button class="del" onclick="delI('${i.id}')">Supprimer</button>`:''}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${link(i.contenu)}</div><small>Ajouté par ${esc(i.auteur?.pseudo||'inconnu')}${i.ass?`, assignée à ${esc(i.ass.pseudo)}`:''}</small></div>`).join('');
  $('#tab').innerHTML=(w?`<div class="form"><input id="ti" maxlength="150" placeholder="Titre"><textarea id="co" rows="2" maxlength="10000" placeholder="${ph}"></textarea><div class="row">${k==='mission'?`<select id="as"><option value="">Non assignée</option>${ppl.map(p=>`<option value="${p[0]}">${esc(p[1])}</option>`).join('')}</select>`:''}<button class="pri" onclick="addI()">Ajouter</button></div></div>`:'')+(rows||'<p class="mu">Rien ici pour l’instant.</p>');
}
async function addI() {
  if(perm(S.tab)<2) return alert('Tu n’as pas les droits pour ajouter cet élément.');
  const t=$('#ti')?.value.trim(), contenu=$('#co')?.value.trim();
  if(!t) return alert('Ajoute un titre.');
  const r={projet_id:S.pid,type:S.tab,titre:t,contenu:contenu||''};
  if(S.tab==='mission' && $('#as')?.value) r.assigne_a=$('#as').value;
  const result=await db.from('items').insert(r);
  if(result.error) return showError(result.error,'Ajout impossible');
  await drawP();
}
async function setSt(id,v) {
  if(perm('mission')<2 || !ST[v]) return alert('Tu n’as pas les droits pour modifier cette mission.');
  const result=await db.from('items').update({statut:v}).eq('id',id).eq('projet_id',S.pid);
  if(result.error) return showError(result.error,'Modification impossible');
  await drawP();
}
async function delI(id) {
  if(perm(S.tab)<2) return alert('Tu n’as pas les droits pour supprimer cet élément.');
  if(!confirm('Supprimer cet élément ?')) return;
  const result=await db.from('items').delete().eq('id',id).eq('projet_id',S.pid);
  if(result.error) return showError(result.error,'Suppression impossible');
  await drawP();
}
async function salons() {
  const w=perm('chat')>1;
  const data=await runQuery(db.from('salons').select('*').eq('projet_id',S.pid).order('nom'),'Chargement des salons');
  if(!data) return; S.sal=data;
  if(!S.sal.some(s=>s.id===S.salon)) S.salon=S.sal[0]?.id||null;
  $('#tab').innerHTML=`<div class="chat"><div>${S.sal.map(s=>`<div class="sl ${s.id===S.salon?'on':''}" onclick="S.salon='${s.id}';salons()"># ${esc(s.nom)}</div>`).join('')||'<small>Aucun salon.</small>'}${w?`<div class="form"><input id="ns" maxlength="60" placeholder="Nom du salon" onkeydown="if(event.key==='Enter')addS()"><button onclick="addS()">Créer le salon</button></div>`:''}</div><div>${S.salon?`<div class="msgs" id="msgs"></div>${w?`<div class="row"><input id="mi" maxlength="3000" placeholder="Écrire un message" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"><button class="pri" onclick="send()">Envoyer</button></div>`:''}`:'<p class="mu">Crée un premier salon pour commencer à discuter.</p>'}</div></div>`;
  if(S.salon) { await loadM(); listen(); }
}
async function addS() {
  if(perm('chat')<2) return alert('Tu n’as pas les droits pour créer un salon.');
  const nom=$('#ns')?.value.trim(); if(!nom) return;
  const result=await db.from('salons').insert({projet_id:S.pid,nom});
  if(result.error) return showError(result.error,'Création du salon impossible');
  S.salon=null; await salons();
}
async function loadM() {
  const salonId=S.salon, projectId=S.pid;
  const data=await runQuery(db.from('messages').select('*,auteur:profiles!auteur_id(pseudo)').eq('salon_id',salonId).order('created_at',{ascending:true}).limit(200),'Chargement des messages');
  if(!data || S.salon!==salonId || S.pid!==projectId) return;
  const el=$('#msgs'); if(!el) return;
  el.innerHTML=data.map(m=>`<div class="m ${m.auteur_id===S.user.id?'me':''}"><small>${esc(m.auteur?.pseudo||'Utilisateur')}, ${m.created_at?new Date(m.created_at).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):''}</small><br>${esc(m.contenu)}</div>`).join('')||'<p class="mu">Aucun message. Lance la discussion.</p>';
  el.scrollTop=el.scrollHeight;
}
function listen() {
  cleanupChannel();
  const sid=S.salon;
  S.ch=db.channel('atelier-salon-'+sid).on('postgres_changes',{event:'*',schema:'public',table:'messages',filter:'salon_id=eq.'+sid},()=>{if(S.salon===sid)loadM();}).subscribe(status=>{if(status==='CHANNEL_ERROR')console.warn('Realtime indisponible : actualisation manuelle possible.');});
}
async function send() {
  if(perm('chat')<2) return alert('Tu n’as pas les droits pour envoyer un message.');
  const i=$('#mi'), contenu=i?.value.trim(); if(!contenu) return;
  i.value='';
  const result=await db.from('messages').insert({salon_id:S.salon,projet_id:S.pid,auteur_id:S.user.id,contenu});
  if(result.error) { i.value=contenu; return showError(result.error,'Envoi impossible'); }
  await loadM();
}
function membres() {
  const c=chef(),p=P();
  const sel=(m,col)=>`<select ${c?'':'disabled'} onchange="setP('${m.user_id}','${col}',this.value)">${PM.map((l,v)=>`<option value="${v}" ${Number(m[col]||0)===v?'selected':''}>${l}</option>`).join('')}</select>`;
  $('#tab').innerHTML=`${c?`<div class="form"><div class="row"><input id="ad" placeholder="Pseudo de la personne à ajouter" maxlength="20" onkeydown="if(event.key==='Enter')addM()"><button class="pri" onclick="addM()">Ajouter</button></div><small id="am"></small></div>`:''}
  <div class="tw"><table><thead><tr><th>Membre</th>${SEC.map(s=>`<th>${s[1]}</th>`).join('')}<th></th></tr></thead><tbody>
  <tr><td><b>${esc(p.chef?.pseudo||'Chef')}</b> (chef)</td><td colspan="4" class="mu">Accès à tout</td><td></td></tr>
  ${S.mem.map(m=>`<tr><td>${esc(m.profil?.pseudo||'Membre')}</td>${SEC.map(s=>`<td>${sel(m,s[2])}</td>`).join('')}<td>${c?`<button class="del" onclick="rmM('${m.user_id}')">Retirer</button>`:''}</td></tr>`).join('')}
  </tbody></table></div>`;
}
async function addM() {
  if(!chef()) return alert('Seul le chef peut ajouter un membre.');
  const ps=$('#ad')?.value.trim().toLowerCase(),m=$('#am'); if(!ps) return;
  const u=await runQuery(db.from('profiles').select('id').eq('pseudo',ps).maybeSingle(),'Recherche du membre');
  if(!u) { m.textContent='Aucun compte avec ce pseudo.'; return; }
  if(u.id===S.user.id || S.mem.some(x=>x.user_id===u.id)) { m.textContent='Cette personne est déjà dans le projet.'; return; }
  const result=await db.from('membres').insert({projet_id:S.pid,user_id:u.id});
  if(result.error) { m.textContent=result.error.message; return; }
  await loadMem(); membres();
}
async function setP(uid,col,v) {
  if(!chef()) return alert('Seul le chef peut modifier les permissions.');
  if(!SEC.some(s=>s[2]===col) || !['0','1','2'].includes(String(v))) return;
  const result=await db.from('membres').update({[col]:Number(v)}).eq('projet_id',S.pid).eq('user_id',uid);
  if(result.error) return showError(result.error,'Modification des permissions impossible');
  await loadMem(); membres();
}
async function rmM(uid) {
  if(!chef()) return alert('Seul le chef peut retirer un membre.');

}

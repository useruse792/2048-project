<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atelier – gestion de projets</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a2238;--bg:#eef1f7;--sf:#fff;--ln:#d9dfeb;--tx:#1a2238;--mu:#667291;--ac:#2f6df6;--ok:#1f9d63;--wa:#d98a00;--ko:#d6403a}
@media(prefers-color-scheme:dark){:root{--ink:#0d1220;--bg:#151b2b;--sf:#1d2540;--ln:#2d3757;--tx:#e9edf8;--mu:#93a0c4}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0}
a{color:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px}
input,textarea{width:100%}
button{cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.del{color:var(--ko);padding:6px 9px}
small,.mu{color:var(--mu)}
.box{max-width:380px;margin:10vh auto;padding:0 16px;display:grid;gap:10px}
.lay{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--ink);color:#e9edf8;padding:18px 14px;display:flex;flex-direction:column;gap:8px}
aside input,aside button:not(.pri){background:#ffffff14;border-color:#ffffff29;color:#fff}
aside small{color:#9aa6c8}
.pj{padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.pj:hover,.pj.on{background:#ffffff1f}
main{padding:24px;max-width:900px;width:100%;min-width:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--ln)}
.tabs button{border:0;background:none;border-radius:8px 8px 0 0;padding:8px 14px}
.tabs .on{font-weight:600;box-shadow:inset 0 -3px var(--ac)}
.bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden;background:var(--ln);margin-bottom:6px}
.bar i{display:block}
.row{display:flex;gap:8px;align-items:center}
.form{display:grid;gap:8px;padding:14px;border:1px dashed var(--ln);border-radius:10px;margin:14px 0}
.it{display:grid;gap:4px;padding:12px 0;border-bottom:1px solid var(--ln)}
.chat{display:grid;grid-template-columns:190px 1fr;gap:16px;margin-top:14px}
.sl{padding:7px 10px;border-radius:8px;cursor:pointer}
.sl.on{background:var(--sf);font-weight:600;box-shadow:inset 3px 0 var(--ac)}
.msgs{height:340px;overflow:auto;display:grid;gap:8px;align-content:start;margin-bottom:10px}
.m{background:var(--sf);border:1px solid var(--ln);padding:7px 11px;border-radius:12px 12px 12px 3px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{justify-self:end;background:var(--ac);border-color:var(--ac);color:#fff;border-radius:12px 12px 3px 12px}
.m.me small{color:#dbe6ff}
.tw{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
.termine{color:var(--ok)}.en_cours{color:var(--ac)}.en_pause{color:var(--wa)}.bloque{color:var(--ko)}
@media(max-width:760px){.lay,.chat{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Renseigne ces deux valeurs, ou laisse vide : l'appli te les demandera au premier lancement.
const SUPABASE_URL='https://wvxhjpmvxqjkriunconn.supabase.co',SUPABASE_KEY='sb_publishable_1Vegdzrwfivk6GT1iamWTQ_qXoojXGV';
const U=SUPABASE_URL||localStorage.sb_url,K=SUPABASE_KEY||localStorage.sb_key;
const $=s=>document.querySelector(s),app=$('#app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=t=>esc(t).replace(/https?:\/\/[^\s<]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const ST={non_commence:'Non commencé',en_cours:'En cours',en_pause:'En pause',bloque:'Bloqué',termine:'Terminé'};
const COL={non_commence:'var(--ln)',en_cours:'var(--ac)',en_pause:'var(--wa)',bloque:'var(--ko)',termine:'var(--ok)'};
const PM=['Aucun accès','Lecture','Lecture et écriture'];
const SEC=[['mission','Missions','p_missions'],['document','Documents','p_docs'],['info','Infos','p_infos'],['chat','Salons','p_chat']];
let db,S={};

async function init(){
 if(!U||!K)return cfgView();
 db=supabase.createClient(U,K);
 const{data:{session}}=await db.auth.getSession();
 session?start(session.user):authView();
}
function cfgView(){
 app.innerHTML=`<div class="box"><h1>Connexion à Supabase</h1><p class="mu">Dans Supabase : Project Settings → API. Colle l'URL du projet et la clé publique (anon ou publishable).</p><input id="cu" placeholder="https://xxxx.supabase.co"><input id="ck" placeholder="Clé publique"><button class="pri" onclick="saveCfg()">Enregistrer</button></div>`;
}
function saveCfg(){localStorage.sb_url=$('#cu').value.trim();localStorage.sb_key=$('#ck').value.trim();location.reload()}

function authView(mode='in'){
 const up=mode=='up';
 app.innerHTML=`<div class="box"><h1>Atelier</h1><p class="mu">Gère tes projets en équipe : missions, documents, discussions.</p>
 <div class="tabs"><button class="${up?'':'on'}" onclick="authView('in')">Connexion</button><button class="${up?'on':''}" onclick="authView('up')">Créer un compte</button></div>
 ${up?'<input id="ps" placeholder="Pseudo (lettres, chiffres, _)" maxlength="20" autocomplete="username">':''}
 <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Mot de passe (6 caractères minimum)" autocomplete="${up?'new-password':'current-password'}" onkeydown="if(event.key=='Enter')auth('${mode}')">
 <button class="pri" onclick="auth('${mode}')">${up?'Créer mon compte':'Se connecter'}</button><small id="msg"></small></div>`;
}
async function auth(mode){
 const email=$('#em').value.trim(),password=$('#pw').value,m=$('#msg');
 if(mode=='up'){
  const pseudo=$('#ps').value.trim().toLowerCase();
  if(!/^[a-z0-9_]{3,20}$/.test(pseudo))return m.textContent='Pseudo invalide : 3 à 20 caractères, lettres, chiffres ou _.';
  const{data,error}=await db.auth.signUp({email,password,options:{data:{pseudo}}});
  if(error)return m.textContent=/database/i.test(error.message)?'Ce pseudo est déjà pris.':error.message;
  return data.session?start(data.user):m.textContent='Compte créé. Confirme ton email, puis connecte-toi.';
 }
 const{data,error}=await db.auth.signInWithPassword({email,password});
 error?m.textContent=error.message:start(data.user);
}
async function logout(){if(S.ch)db.removeChannel(S.ch);await db.auth.signOut();S={};authView()}

async function start(user){
 S={user,tab:null};
 const{data}=await db.from('profiles').select('pseudo').eq('id',user.id).single();
 S.pseudo=data?.pseudo||'?';
 await loadProjets();draw();
}
async function loadProjets(){
 const{data}=await db.from('projets').select('*,chef:profiles!chef_id(pseudo)').order('created_at');
 S.projets=data||[];
}
async function loadMem(){
 const{data}=await db.from('membres').select('*,profil:profiles(pseudo)').eq('projet_id',S.pid);
 S.mem=data||[];
}
const P=()=>S.projets.find(p=>p.id==S.pid);
const chef=()=>P().chef_id==S.user.id;
const perm=k=>{if(chef())return 2;const m=S.mem.find(x=>x.user_id==S.user.id);return m?m[SEC.find(s=>s[0]==k)[2]]:0};

function draw(){
 app.innerHTML=`<div class="lay"><aside><h1>Atelier</h1>
 ${S.projets.map(p=>`<div class="pj ${p.id==S.pid?'on':''}" onclick="openP('${p.id}')"><span>${esc(p.nom)}</span><small>${p.chef_id==S.user.id?'chef':''}</small></div>`).join('')||'<small>Aucun projet pour l’instant.</small>'}
 <input id="np" placeholder="Nom du nouveau projet" onkeydown="if(event.key=='Enter')newP()"><button class="pri" onclick="newP()">Créer le projet</button>
 <div class="row" style="margin-top:auto;justify-content:space-between"><span>${esc(S.pseudo)}</span><button onclick="logout()">Déconnexion</button></div></aside>
 <main id="main"><p class="mu">Choisis un projet, ou crée le tien : tu en seras le chef.</p></main></div>`;
 if(S.pid)drawP();
}
async function newP(){
 const nom=$('#np').value.trim();if(!nom)return;
 const{data,error}=await db.from('projets').insert({nom}).select().single();
 if(error)return alert(error.message);
 await loadProjets();openP(data.id);
}
async function openP(id){S.pid=id;S.tab=null;S.salon=null;await loadMem();draw()}
async function delP(){
 if(!confirm('Supprimer définitivement ce projet ?'))return;
 await db.from('projets').delete().eq('id',S.pid);S.pid=null;await loadProjets();draw();
}

async function drawP(){
 if(S.ch){db.removeChannel(S.ch);S.ch=null}
 const p=P(),tabs=[...SEC.filter(s=>perm(s[0])>0).map(s=>[s[0],s[1]]),['membres','Membres']];
 if(!tabs.some(t=>t[0]==S.tab))S.tab=tabs[0][0];
 $('#main').innerHTML=`<div class="row" style="justify-content:space-between"><div><h2>${esc(p.nom)}</h2><small>Chef de projet : ${esc(p.chef.pseudo)}</small></div>${chef()?'<button class="del" onclick="delP()">Supprimer le projet</button>':''}</div>
 <div id="prog" style="margin:14px 0"></div>
 <div class="tabs">${tabs.map(t=>`<button class="${t[0]==S.tab?'on':''}" onclick="S.tab='${t[0]}';drawP()">${t[1]}</button>`).join('')}</div><div id="tab"></div>`;
 ({mission:items,document:items,info:items,chat:salons,membres})[S.tab]();
 if(perm('mission')>0)progress();
}
async function progress(){
 const{data}=await db.from('items').select('statut').eq('projet_id',S.pid).eq('type','mission');
 const g=$('#prog');if(!g||!data)return;
 const c={};Object.keys(ST).forEach(s=>c[s]=data.filter(i=>i.statut==s).length);
 const n=data.length,pc=n?Math.round(c.termine/n*100):0;
 g.innerHTML=`<div class="bar">${Object.keys(ST).filter(s=>c[s]).map(s=>`<i title="${ST[s]}" style="flex:${c[s]};background:${COL[s]}"></i>`).join('')}</div><small>${n?`${pc} % terminé (${c.termine} mission${c.termine>1?'s':''} sur ${n})`:'Aucune mission pour l’instant.'}</small>`;
}

async function items(){
 const k=S.tab,w=perm(k)>1,ph={mission:'Description de la mission',document:'Lien (https://…) ou contenu du document',info:'Information à partager'}[k];
 const{data}=await db.from('items').select('*,auteur:profiles!auteur_id(pseudo),ass:profiles!assigne_a(pseudo)').eq('projet_id',S.pid).eq('type',k).order('created_at',{ascending:false});
 const ppl=[[P().chef_id,P().chef.pseudo],...S.mem.map(m=>[m.user_id,m.profil?.pseudo])];
 const rows=(data||[]).map(i=>`<div class="it"><div class="row"><b style="flex:1">${esc(i.titre)}</b>${k=='mission'?`<select class="${i.statut}" ${w?'':'disabled'} onchange="setSt('${i.id}',this.value)">${Object.entries(ST).map(([v,l])=>`<option value="${v}" ${i.statut==v?'selected':''}>${l}</option>`).join('')}</select>`:''}${w?`<button class="del" onclick="delI('${i.id}')">Supprimer</button>`:''}</div><div style="white-space:pre-wrap;overflow-wrap:anywhere">${link(i.contenu)}</div><small>Ajouté par ${esc(i.auteur?.pseudo)}${i.ass?`, assignée à ${esc(i.ass.pseudo)}`:''}</small></div>`).join('');
 $('#tab').innerHTML=(w?`<div class="form"><input id="ti" placeholder="Titre"><textarea id="co" rows="2" placeholder="${ph}"></textarea><div class="row">${k=='mission'?`<select id="as"><option value="">Non assignée</option>${ppl.map(p=>`<option value="${p[0]}">${esc(p[1])}</option>`).join('')}</select>`:''}<button class="pri" onclick="addI()">Ajouter</button></div></div>`:'')+(rows||'<p class="mu">Rien ici pour l’instant.</p>');
}
async function addI(){
 const t=$('#ti').value.trim();if(!t)return;
 const r={projet_id:S.pid,type:S.tab,titre:t,contenu:$('#co').value.trim()};
 if(S.tab=='mission'&&$('#as').value)r.assigne_a=$('#as').value;
 const{error}=await db.from('items').insert(r);
 error?alert(error.message):drawP();
}
async function setSt(id,v){await db.from('items').update({statut:v}).eq('id',id);drawP()}
async function delI(id){if(confirm('Supprimer cet élément ?')){await db.from('items').delete().eq('id',id);drawP()}}

async function salons(){
 const w=perm('chat')>1;
 const{data}=await db.from('salons').select('*').eq('projet_id',S.pid).order('nom');
 S.sal=data||[];
 if(!S.sal.some(s=>s.id==S.salon))S.salon=S.sal[0]?.id;
 $('#tab').innerHTML=`<div class="chat"><div>${S.sal.map(s=>`<div class="sl ${s.id==S.salon?'on':''}" onclick="S.salon='${s.id}';salons()"># ${esc(s.nom)}</div>`).join('')||'<small>Aucun salon.</small>'}${w?`<div class="form"><input id="ns" placeholder="Nom du salon" onkeydown="if(event.key=='Enter')addS()"><button onclick="addS()">Créer le salon</button></div>`:''}</div>
 <div>${S.salon?`<div class="msgs" id="msgs"></div>${w?`<div class="row"><input id="mi" placeholder="Écrire un message" onkeydown="if(event.key=='Enter')send()"><button class="pri" onclick="send()">Envoyer</button></div>`:''}`:'<p class="mu">Crée un premier salon pour commencer à discuter.</p>'}</div></div>`;
 if(S.salon){loadM();listen()}
}
async function addS(){
 const nom=$('#ns').value.trim();if(!nom)return;
 const{error}=await db.from('salons').insert({projet_id:S.pid,nom});
 error?alert(error.message):salons();
}
async function loadM(){
 const{data}=await db.from('messages').select('*,auteur:profiles!auteur_id(pseudo)').eq('salon_id',S.salon).order('created_at').limit(200);
 const el=$('#msgs');if(!el)return;
 el.innerHTML=(data||[]).map(m=>`<div class="m ${m.auteur_id==S.user.id?'me':''}"><small>${esc(m.auteur?.pseudo)}, ${new Date(m.created_at).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})}</small><br>${esc(m.contenu)}</div>`).join('')||'<p class="mu">Aucun message. Lance la discussion.</p>';
 el.scrollTop=el.scrollHeight;
}
function listen(){
 if(S.ch)db.removeChannel(S.ch);
 S.ch=db.channel('salon-'+S.salon).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'salon_id=eq.'+S.salon},loadM).subscribe();
}
async function send(){
 const i=$('#mi'),contenu=i.value.trim();if(!contenu)return;i.value='';
 const{error}=await db.from('messages').insert({salon_id:S.salon,projet_id:S.pid,contenu});
 error?alert(error.message):loadM();
}

function membres(){
 const c=chef(),p=P();
 const sel=(m,col)=>`<select ${c?'':'disabled'} onchange="setP('${m.user_id}','${col}',this.value)">${PM.map((l,v)=>`<option value="${v}" ${m[col]==v?'selected':''}>${l}</option>`).join('')}</select>`;
 $('#tab').innerHTML=`${c?`<div class="form"><div class="row"><input id="ad" placeholder="Pseudo de la personne à ajouter" onkeydown="if(event.key=='Enter')addM()"><button class="pri" onclick="addM()">Ajouter</button></div><small id="am"></small></div>`:''}
 <div class="tw"><table><tr><th>Membre</th>${SEC.map(s=>`<th>${s[1]}</th>`).join('')}<th></th></tr>
 <tr><td><b>${esc(p.chef.pseudo)}</b> (chef)</td><td colspan="4" class="mu">Accès à tout</td><td></td></tr>
 ${S.mem.map(m=>`<tr><td>${esc(m.profil?.pseudo)}</td>${SEC.map(s=>`<td>${sel(m,s[2])}</td>`).join('')}<td>${c?`<button class="del" onclick="rmM('${m.user_id}')">Retirer</button>`:''}</td></tr>`).join('')}</table></div>`;
}
async function addM(){
 const ps=$('#ad').value.trim().toLowerCase(),m=$('#am');if(!ps)return;
 const{data:u}=await db.from('profiles').select('id').eq('pseudo',ps).maybeSingle();
 if(!u)return m.textContent='Aucun compte avec ce pseudo.';
 if(u.id==S.user.id||S.mem.some(x=>x.user_id==u.id))return m.textContent='Cette personne est déjà dans le projet.';
 const{error}=await db.from('membres').insert({projet_id:S.pid,user_id:u.id});
 if(error)return m.textContent=error.message;
 await loadMem();membres();
}
async function setP(uid,col,v){await db.from('membres').update({[col]:+v}).eq('projet_id',S.pid).eq('user_id',uid);await loadMem()}
async function rmM(uid){
 if(!confirm('Retirer ce membre du projet ?'))return;
 await db.from('membres').delete().eq('projet_id',S.pid).eq('user_id',uid);await loadMem();membres();
}
init();
</script>
</body>
</html>
